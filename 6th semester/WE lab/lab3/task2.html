<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50  min-h-screen flex items-center justify-center">
    <div class="max-w-md border border-gray-300 rounded-lg px-8  bg-white ">
        <form class=" max-w-sm mx-auto">
            <h6 class="m-5 text-xl font-bold text-center">Sign in</h6>
            <div class="mb-5">
                <label for="username" class="block mb-2 text-sm text-black-600">User name</label>
                <div class="relative">
                    <input type="text" id="username" class="border border-gray-300 rounded-md pl-3 pr-10 py-2 w-full "
                        placeholder="Enter username">
                    <i class="fas fa-user absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 "></i>
                </div>
            </div>
            <div class="mb-5">
                <label for="password" class="block mt-4 mb-2 text-sm text-black-600">Password</label>
                <div class="relative">
                    <input type="password" id="password"
                        class="border border-gray-300 rounded-md pl-3 pr-10 py-2 w-full " placeholder="Enter password">
                    <i class="fas fa-eye absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 "></i>
                </div>
            </div>
            <div class="flex items-center justify-between mb-5">
                <div class="flex items-center h-5">
                    <input id="remember" type="checkbox" value=""
                        class="w-4 h-4 border border-gray-300 rounded-sm bg-gray-50 mr-1" />
                </div>
                <label for="remember" class="text-sm text-gray-900 mr-7">Remember me</label>


                <a href="#" class="text-sm text-blue-500 hover:underline font-bold">Forgot your password?</a>
            </div>
            <button type="submit"
                class=" mx-auto p-3 w-full mb-4 block text-white bg-blue-700 rounded-lg text-center">Sign in</button>
            <div class="flex items-center justify-center mb-5">
                <div class="block text-sm text-black-600 text-center mr-2">
                    Don't have an account?
                </div>
                <a href="#" class="text-sm text-blue-500 hover:underline font-bold">
                    Register here
                </a>
            </div>




    </div>
    </form>
    </div>
    </input>
    </div>
    </div>

    </form>
    </div>
</body>

</html>
