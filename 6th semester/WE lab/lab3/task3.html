<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .todo-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-save {
            background-color: #007bff;
            color: white;
        }
        .btn-get-tasks {
            background-color: #ffcc00;
            color: white;
        }
        .btn-delete {
            background-color: #ff4d4d;
            color: white;
        }
        .btn-finished {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="todo-container text-center">
            <h3 class="mb-4">To Do App</h3>
            <div class="mb-3 d-flex">
                <input type="text" class="form-control me-2" placeholder="Enter a task here">
                <button class="btn btn-save">SAVE</button>
                <button class="btn btn-get-tasks ms-2">GET TASKS</button>
            </div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Todo item</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Buy groceries for next week</td>
                        <td>In progress</td>
                        <td>
                            <button class="btn btn-delete">DELETE</button>
                            <button class="btn btn-finished ms-2">FINISHED</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Renew car insurance</td>
                        <td>In progress</td>
                        <td>
                            <button class="btn btn-delete">DELETE</button>
                            <button class="btn btn-finished ms-2">FINISHED</button>
                        </td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Sign up for online course</td>
                        <td>In progress</td>
                        <td>
                            <button class="btn btn-delete">DELETE</button>
                            <button class="btn btn-finished ms-2">FINISHED</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
