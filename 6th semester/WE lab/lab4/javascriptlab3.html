<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        #myDiv {
            background-color: lightblue;
            padding: 20px;
            border: 1px solid blue;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation Demo</h1>

    <div id="myDiv">
        <p id="myParagraph">This is a paragraph inside the div.</p>
        <ul>
            <li class="item">Item 1</li>
            <li class="item">Item 2</li>
            <li class="item">Item 3</li>
        </ul>
        <button id="myButton">Change Text</button>
        <input type="text" id="myInput" value="Initial Value">
    </div>

    <h1>Add Two Numbers</h1>
    <form id="myForm">
        <label for="num1">Number 1:</label>
        <input type="number" id="num1" name="num1" required><br><br>

        <label for="num2">Number 2:</label>
        <input type="number" id="num2" name="num2" required><br><br>

        <button type="button" class="btn btn-danger" id="addButton">ADD</button>
    </form>

    <div id="result"></div>

    <h3>Greetings:</h3>
    <div class="form-group">
        <label for="Name">Your Name: </label>
        <input type="text" class="form-control" name="name" id="name" aria-describedby="helpId" placeholder="">
        <small id="helpId" class="form-text text-muted">Your greetings</small>
        <button type="button" class="btn btn-warning" id="greetButton">Greet me</button>
    </div>
    <div id="result2"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script>
        // 1. Selecting Elements (Do this FIRST)
        const myDiv = document.getElementById("myDiv");
        const myParagraph = document.getElementById("myParagraph");
        const myButton = document.getElementById("myButton");
        function changeText() {
            myParagraph.innerHTML = "The text has been <strong>changed!</strong>";
        }

    
        myButton.addEventListener("click", changeText);
        
        // const myInput = document.getElementById("myInput");
        // const listItems = document.getElementsByClassName("item");

        const num1Input = document.getElementById("num1");
        const num2Input = document.getElementById("num2");
        const addButton = document.getElementById("addButton");
        const resultDiv = document.getElementById("result");

        function addNumbers() {
            const num1 = parseFloat(num1Input.value);
            const num2 = parseFloat(num2Input.value);

            if (isNaN(num1) || isNaN(num2)) {
                resultDiv.textContent = "Please enter valid numbers.";
                return;
            }
            const sum = num1 + num2;
            resultDiv.textContent = "The sum is: " + sum;
            console.log("sum: ", sum);

        }
        addButton.addEventListener("click", addNumbers);

        const nameInput = document.getElementById("name");
        const greetButton = document.getElementById("greetButton");
        const resultDiv2 = document.getElementById("result2");


        // 2. Functions (Define these BEFORE using them)

        function greet() {
        const user = nameInput.value; // Get the value from the input field

        if (user.trim() === "") {
            resultDiv2.textContent = "Please enter your name.";
            return;
        }

        resultDiv2.textContent = "Hello " + user + "!"; // Display greeting message
    }

    // 3. Event Listener
    greetButton.addEventListener("click", greet); // Corrected event listener target


        // 4. Other DOM manipulation (e.g., changing styles)
        myDiv.style.backgroundColor = "purple";

    </script>

</body>

</html>
