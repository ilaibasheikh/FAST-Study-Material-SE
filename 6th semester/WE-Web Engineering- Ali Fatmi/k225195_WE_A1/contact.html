<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">
    <header class="bg-pink-800 text-white text-center py-5 text-2xl font-bold">
        Laiba Fatima 22K-5195
    </header>

    <nav class="bg-pink-700 p-4">
        <div class="container mx-auto flex justify-center">
            <div class="flex space-x-6">
                <a href="home.html" class="text-black font-bold hover:text-white">Home</a>
                <a href="quiz.html" class="text-black font-bold hover:text-white">Quiz</a>
                <a href="contact.html" class="text-black font-bold hover:text-white">Contact Us</a>
                <a href="about.html" class="text-black font-bold hover:text-white">About Us</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-10 p-6 bg-gray-200 shadow-lg rounded-lg max-w-lg">
        <h2 class="text-2xl font-bold mb-4"> Talk to Me :) </h2>
        <form>
            <div class="mb-4">
                <label class="block text-gray-700">Name</label>
                <input type="text" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder="Your Name">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Email</label>
                <input type="email" class="w-full p-2 border border-gray-300 rounded mt-1" placeholder="Your Email">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Message</label>
                <textarea class="w-full p-2 border border-gray-300 rounded mt-1" rows="4" placeholder="Your Message"></textarea>
            </div>
            <button class="bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-800">Send Message</button>
        </form>
    </div>
</body>
</html>
