<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-based CSS Manipulation</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .box { width: 200px; height: 200px; background-color: lightgray; margin: 20px auto; transition: all 0.3s; }
        .hover-effect { background-color: lightblue !important; }
        .clicked-effect { border: 3px solid red; }
        .resized { width: 300px; height: 300px; background-color: yellow; }
        button { padding: 10px 15px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>CSS & Event Manipulation</h2>
    <div class="box" id="myBox"></div>

    <button id="hoverBtn">Hover Me</button>
    <button id="clickBtn">Click Me</button>
    <button id="resizeBtn">Resize Box</button>
    <button id="resetBtn">Reset</button>

    <script>
        let box = document.getElementById("myBox");

        // Apply class on hover
        document.getElementById("hoverBtn").addEventListener("mouseover", function() {
            box.classList.add("hover-effect");
        });

        document.getElementById("hoverBtn").addEventListener("mouseout", function() {
            box.classList.remove("hover-effect");
        });

        // Apply class on click
        document.getElementById("clickBtn").addEventListener("click", function() {
            box.classList.toggle("clicked-effect");
        });

        // Resize div
        document.getElementById("resizeBtn").addEventListener("click", function() {
            box.classList.toggle("resized");
        });

        // Reset all styles
        document.getElementById("resetBtn").addEventListener("click", function() {
            box.classList.remove("hover-effect", "clicked-effect", "resized");
            box.style = "";
        });
    </script>

</body>
</html>
