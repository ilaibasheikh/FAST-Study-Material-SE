<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 
    <style>
        .box {
            border: 2px solid blue;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            margin-bottom: 1px;
            margin-top: 1px;
            
        }
    </style>
</head>

<body class="container">
    <div class="row">
        <div class="col-2">
            <div class="row">
                <div class="col-12 box " style="height: 150px;">
                    A
                </div>
                <div class="col-12 box " style="height: 126px;">
                    B
                </div>

            </div>
        </div>
        <div class="col-10">
            <div class="row">
                <div class="col-8 box ">
                    C
                </div>
                <div class="col-4 box ">
                    D
                </div>
            </div>
            <div class="row">
                <div class="col-6 box ">
                    E
                </div>
                
                <div class="col-6  ">
                    <div class="row">
                        <div class="col-12 box ">
                            F
                        </div>
                        <div class="col-12 box ">
                            G
                        </div>
                    </div>
                </div>
                <div class="col-12 box">
                    H
                </div>
            </div>
        </div>

    </div>


</body>

</html>
