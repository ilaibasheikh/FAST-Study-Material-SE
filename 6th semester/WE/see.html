<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Grid Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            border: 1px solid blue;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="container">

    <div class="row">
        <div class="col-sm-2">
            <div class="row">
                <div style="height: 170px;" class="col-sm-12 box">A</div>
                <div style="height: 120px;" class="col-sm-12 box">B</div>
            </div>
        </div>
        <div class="col-sm-10">
            <div class="row">
                <div class="col-sm-8 box">C</div>
                <div class="col-sm-4 box">D</div>
            </div>
            <div class="row">
                <div style="height: 147px;" class="col-sm-7 box">E</div>
                <div class="col-sm-5">
                    <div class="row">
                        <div class="col-sm-12 box">F</div>
                        <div class="col-sm-12 box">G</div>
                    </div>
                </div>
                <div class="col-sm-12 box">H</div>
            </div>
        </div>
    </div>
</body>

</html>
